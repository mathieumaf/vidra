# cargo-deny policy for Vidra.
#
# Vidra is GPL-3.0-or-later. A license is allowed only when it can be combined
# with that license and the current graph actually requires it. An SPDX "OR"
# expression passes when any one option is allowed, so dual-licensed crates do
# not add their other options to this list. Per-crate exceptions are reserved
# for a license that should not be accepted from an arbitrary new dependency.

[graph]
# Crates linked into the Apple Silicon application, plus the Linux crates
# Tauri resolves for a desktop build. Windows-only crates stay out of this
# graph until Vidra builds for Windows; add that target here when it does.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is unmaintained and has no patched release. glib-macros 0.18 and gtk3-macros 0.18, used by Tauri 2.12 for its Linux GTK backend, still depend on it. It is a compile-time proc macro and is not linked into the application. Remove this ignore when Tauri no longer depends on those gtk-rs 0.18 crates." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 was folded into zbus 6 and has no patched 5.x release. tauri-plugin-opener and tauri-plugin-single-instance 2.x depend on zbus 5 for Linux D-Bus. This is an unmaintained-crate notice, not a vulnerability advisory. Remove this ignore when those plugins move to zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 was folded into zbus 6 and has no patched release. It is only present because Tauri's Linux opener and single-instance plugins depend on zbus 5. This is an unmaintained-crate notice, not a vulnerability advisory. Remove this ignore when those plugins move to zbus 6." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 was folded into zbus 6 and has no patched release. It is only present because Tauri's Linux opener and single-instance plugins depend on zbus 5. This is an unmaintained-crate notice, not a vulnerability advisory. Remove this ignore when those plugins move to zbus 6." },
]

[licenses]
version = 2
# Reject a license file that does not closely match the canonical SPDX text.
confidence-threshold = 0.93
allow = [
    # Vidra itself.
    "GPL-3.0-or-later",
    # Permissive licenses. MIT and Apache-2.0 cover most of the graph,
    # including crates that are also offered under Unlicense, 0BSD, CC0-1.0,
    # MIT-0, or LGPL-2.1-or-later. Those alternatives are not listed here, so
    # a future dependency that uses one of them as its only license still fails.
    "MIT",
    "Apache-2.0",
    # target-lexicon is published only under this SPDX exception. The LLVM
    # exception is permissive and GPL-3.0-compatible.
    "Apache-2.0 WITH LLVM-exception",
    # Required on its own by subtle, alloc-no-stdlib, and alloc-stdlib, and
    # required in addition to MIT by brotli and encoding_rs.
    "BSD-3-Clause",
    # Required on its own by rustls-webpki and untrusted, and required in
    # addition to Apache-2.0 by ring.
    "ISC",
    # foldhash is published only under the zlib license, which is GPL-compatible.
    "Zlib",
    # The ICU data crates are published only under the Unicode License v3.
    # unicode-ident requires it in addition to MIT or Apache-2.0. The Unicode
    # License v3 is a permissive license and is GPL-compatible.
    "Unicode-3.0",
    # cssparser, selectors, dtoa-short, and option-ext are MPL-2.0 only.
    # MPL-2.0 section 3.3 allows that code to be included in a GPL-3.0 work.
    "MPL-2.0",
]
# webpki-root-certs is in Cargo.lock under CDLA-Permissive-2.0, but it is not
# compiled for the targets above. It is intentionally not allowed. If a change
# starts building it, the license check fails until that data license is reviewed.
exceptions = []

[licenses.private]
ignore = false

[bans]
# Tauri's tree carries several major versions of the same crate (gtk-rs 0.18,
# ring, schemars, and similar pins). Failing CI on those duplicates would
# break routine Dependabot and Tauri bumps for reasons other than security or
# licensing. Warnings stay in the cargo-deny log and do not fail the check.
# There is no skip list: a skip names an exact version and fails once that
# version disappears, which is the maintenance cost this setting avoids.
multiple-versions = "warn"
# A "*" version requirement is still rejected.
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
