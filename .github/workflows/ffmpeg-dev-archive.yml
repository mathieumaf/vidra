name: FFmpeg development archive

# Manual only. This builds the Apple Silicon development sidecar from the
# release recipe and uploads it to a prerelease tag. It does not sign or
# notarize Vidra, and it does not publish an application update.
# The tag must not start with `v`, so the application release workflow does
# not run. The updater workflow ignores tags that do not start with `v`.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffmpeg-dev-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Build and upload development FFmpeg archive
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install native build tools
        run: brew install autoconf automake libtool cmake meson ninja pkgconf nasm

      - name: Build FFmpeg from the release recipe
        run: node scripts/ffmpeg/prepare.mjs --build

      - name: Package development archive
        run: node scripts/ffmpeg/package-dev-archive.mjs

      - name: Upload development archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          META="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pin = JSON.parse(readFileSync("scripts/ffmpeg/dev-archive.json", "utf8"));
            if (!pin.tag || pin.tag.startsWith("v")) {
              throw new Error("The development archive tag must not start with v.");
            }
            process.stdout.write(`${pin.tag}\n${pin.archiveName}\n${pin.version}\n`);
          ')"
          TAG="$(printf "%s\n" "$META" | sed -n 1p)"
          NAME="$(printf "%s\n" "$META" | sed -n 2p)"
          VERSION="$(printf "%s\n" "$META" | sed -n 3p)"
          ARCHIVE="release-assets/dev-archive/$NAME"
          SUM="$ARCHIVE.sha256"
          test -f "$ARCHIVE"
          test -f "$SUM"
          NOTES="$(cat <<EOF
          Development FFmpeg ${VERSION} and FFprobe for Vidra, built with scripts/ffmpeg/build-release.mjs.

          This is not a Vidra application release and it is not an application update. The archive contains the executables and the corresponding source archives used to build them.

          Replace the checksum in scripts/ffmpeg/dev-archive.json with the SHA-256 in the attached .sha256 file.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$SUM" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$SUM" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "FFmpeg development sidecar ${VERSION}" \
              --notes "$NOTES"
          fi
