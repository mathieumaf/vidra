name: Publish application update manifests

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: updater-manifest
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.tag_name != 'updater-manifest'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publication scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test channel publication rules
        run: node --test scripts/release/*.node-test.mjs

      - name: Publish Stable and Beta manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release/publish-updater-manifests.mjs
