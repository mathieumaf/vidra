name: Publish application update manifest

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: updater-manifest
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.tag_name != 'updater-manifest'
    runs-on: ubuntu-latest
    steps:
      - name: Download the published release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/updater-manifest"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$RUNNER_TEMP/updater-manifest"

      - name: Publish the rolling updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          if gh release view updater-manifest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload updater-manifest \
              "$RUNNER_TEMP/updater-manifest/latest.json" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create updater-manifest \
              "$RUNNER_TEMP/updater-manifest/latest.json" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "Vidra updater manifest" \
              --notes "Mutable manifest used by Vidra to discover the newest published signed release." \
              --prerelease
          fi
