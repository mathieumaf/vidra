name: Release

# Runs when a vX.Y.Z tag is pushed. It builds, signs, and notarizes the
# application from the commit CI already proved, and leaves a draft release.
# Publishing that draft by hand is what offers the update to installed copies.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

# One run per tag. Runs for different tags do not wait for each other, so a
# pending release is never dropped.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_DIRECTORY: src-tauri/target/aarch64-apple-darwin/release/bundle

jobs:
  release:
    name: Build, sign, notarize, and draft the release
    runs-on: macos-26
    environment: release
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a tag on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Set up the build
        uses: ./.github/actions/setup
        with:
          cache: "false"

      - name: Check the release version and its notes
        run: pnpm release:check -- "$GITHUB_REF_NAME"

      # The same checks as CI, on the tagged commit, with the same engine.
      - name: Prove the source
        run: pnpm check

      - name: Write the release notes
        run: node scripts/release/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      # GPL corresponding sources of the bundled engine, checked against the
      # checksums the recipe pins.
      - name: Export the FFmpeg corresponding sources
        run: pnpm ffmpeg:prepare -- --export-sources release-assets/ffmpeg-sources

      - name: Install Developer ID G2 intermediate certificate
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          EXPECTED_SHA256="f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"
          curl --fail --location --silent --show-error \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$CERTIFICATE_PATH"
          ACTUAL_SHA256="$(shasum -a 256 "$CERTIFICATE_PATH" | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          security import "$CERTIFICATE_PATH" \
            -k "$HOME/Library/Keychains/login.keychain-db"

      - name: Build signed and notarized application
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only a build made here checks for updates when it starts.
          VIDRA_OFFICIAL_BUILD: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Vidra ${{ github.ref_name }}
          # This line also becomes the note the app shows with the update. The
          # release page gets the changelog section in the last step.
          releaseBody: The changes in this release are listed on its GitHub release page.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --bundles app,dmg --target aarch64-apple-darwin

      - name: Verify the application bundle
        run: node scripts/release/verify-bundle.mjs "$BUNDLE_DIRECTORY/macos/Vidra.app"

      # An installed copy refuses an update whose signature was made for
      # another version or another archive. Check both on the draft, with the
      # archive built on this runner, before the draft can be published.
      - name: Verify the update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(find "$BUNDLE_DIRECTORY/macos" -maxdepth 1 -name '*.app.tar.gz' | wc -l | tr -d ' ')" = "1"
          LOCAL_ARCHIVE="$(find "$BUNDLE_DIRECTORY/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"

          DRAFT_DIRECTORY="$RUNNER_TEMP/draft"
          mkdir -p "$DRAFT_DIRECTORY"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --pattern '*.app.tar.gz' --dir "$DRAFT_DIRECTORY"
          test "$(find "$DRAFT_DIRECTORY" -maxdepth 1 -name '*.app.tar.gz' | wc -l | tr -d ' ')" = "1"
          cmp "$LOCAL_ARCHIVE" "$(find "$DRAFT_DIRECTORY" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"

          gh release view "$GITHUB_REF_NAME" --json assets > "$DRAFT_DIRECTORY/release.json"
          node scripts/release/verify-updater-manifest.mjs \
            "$DRAFT_DIRECTORY/latest.json" "$GITHUB_REF_NAME" "$LOCAL_ARCHIVE" "$DRAFT_DIRECTORY/release.json"

      - name: Verify signature and notarization
        run: |
          DMG_PATH="$(find "$BUNDLE_DIRECTORY/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"

          MOUNT_POINT="$RUNNER_TEMP/vidra-dmg"
          mkdir -p "$MOUNT_POINT"
          detach_dmg() {
            hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true
          }
          trap detach_dmg EXIT
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_POINT"

          APP_PATH="$(find "$MOUNT_POINT" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          node scripts/release/verify-bundle.mjs "$APP_PATH"

          detach_dmg
          trap - EXIT

      - name: Attach the notes, the checksum, and the corresponding sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_PATH="$(find "$BUNDLE_DIRECTORY/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          DMG_NAME="$(basename "$DMG_PATH")"
          (cd "$(dirname "$DMG_PATH")" && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")

          gh release upload "$GITHUB_REF_NAME" release-assets/ffmpeg-sources/* "$DMG_PATH.sha256" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft --notes-file "$RUNNER_TEMP/release-notes.md"

      # A draft that failed a check, or whose run was cancelled or timed out,
      # must not stay publishable. The tag stays.
      - name: Delete the draft unless every step succeeded
        if: ${{ !success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
