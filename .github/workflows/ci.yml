name: CI

# Pull requests to main only. `main` is squash-only and requires an up-to-date
# branch, so the merge commit's tree is the one these jobs just checked. A
# `push: [main]` trigger would run the same thing again.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Apple Silicon build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whitespace check below compares against the base branch.
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup

      - name: Build frontend
        run: pnpm build

      - name: Test frontend and scripts
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # Encodes tiny synthetic clips with the pinned engine, the one a release
      # bundles. It fails when that engine lacks an encoder or filter Vidra uses.
      - name: Test conversion corpus
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib conversion_corpus -- --ignored --nocapture

      - name: Check version files
        run: pnpm release:check

      - name: Check patch formatting
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/$BASE_REF...HEAD"

  # The release workflow runs only on a tag. This job builds the same bundle
  # without signing it, so a bundling failure is found on the pull request.
  bundle:
    name: Build the application bundle
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the build
        uses: ./.github/actions/setup

      - name: Build the unsigned application
        run: >-
          pnpm tauri build --bundles app --target aarch64-apple-darwin --no-sign
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify the application bundle
        run: node scripts/release/verify-bundle.mjs src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Vidra.app

  # cargo-deny reads the lockfile. It does not build or run the application.
  dependencies:
    name: Check Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action image's own toolchain is too old to read the lockfile, so
      # cargo-deny runs on the version that rust-toolchain.toml pins.
      - name: Read the pinned Rust version
        id: rust
        run: |
          version="$(sed -n 's/^channel = "\([0-9][0-9.]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          rust-version: ${{ steps.rust.outputs.version }}
          arguments: "--locked"
          command: check
          log-level: warn
