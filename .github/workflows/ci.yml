name: CI

# PRs targeting main only. `main` is squash-only, so the merge commit's tree
# is the PR head that `validate` just checked — a `push: [main]` trigger would
# only pay to re-run it, on a macOS runner billed at 10×. Pushes to a branch
# with no open PR run nothing, by design.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Apple Silicon build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust checks
        run: rustup component add clippy rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Development sidecars only. prepare.mjs reuses a sidecar when its
      # checksum marker matches scripts/ffmpeg/sources.json. The release build
      # is a separate command and is not cached here.
      - name: Cache development FFmpeg sidecars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/ffmpeg
            src-tauri/binaries/ffmpeg-aarch64-apple-darwin
            src-tauri/binaries/ffprobe-aarch64-apple-darwin
            src-tauri/binaries/.ffmpeg-aarch64-apple-darwin.sha256
            src-tauri/binaries/.ffprobe-aarch64-apple-darwin.sha256
          key: ffmpeg-dev-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ffmpeg/sources.json', 'scripts/ffmpeg/prepare.mjs') }}

      - name: Prepare FFmpeg sidecars
        run: pnpm ffmpeg:prepare

      - name: Build frontend
        run: pnpm build

      - name: Test frontend
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check patch formatting
        run: git diff --check

  # Compiles the portable subset on Linux. macOS-only behavior must return an
  # explicit unsupported-platform error instead of being skipped.
  validate-linux:
    name: Validate portable Linux build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust checks
        run: rustup component add clippy rustfmt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            install -y \
            build-essential \
            curl \
            file \
            ffmpeg \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Test frontend
        run: pnpm test

      - name: Prepare development FFmpeg sidecars from the system install
        run: VIDRA_FFMPEG_DIR=/usr/bin pnpm ffmpeg:prepare

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
