version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # rust-toolchain.toml, the one Rust pin. CI and cargo-deny read it.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
